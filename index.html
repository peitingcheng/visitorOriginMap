<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1d1d">
<meta name="description" content="Explore where Iwo Jima Museum visitors are from and add your hometown to the map.">
<title>Visitor Origins Map </title>
<link rel="stylesheet" href="style.css">
<script src="map-data.js" defer></script>
<script src="app.js?v=2" defer></script>
</head>
<body>
<main class="map-frame" id="map-frame" aria-labelledby="page-title">
  <svg class="map-backdrop" viewBox="0 0 900 530" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g class="guides" aria-hidden="true">
            <circle cx="82" cy="560" r="120"/><circle cx="82" cy="560" r="205"/><circle cx="82" cy="560" r="290"/>
            <circle cx="82" cy="560" r="375"/><circle cx="82" cy="560" r="460"/><circle cx="82" cy="560" r="545"/>
            <circle cx="82" cy="560" r="630"/><circle cx="82" cy="560" r="715"/><circle cx="82" cy="560" r="800"/>
            <path d="M82 560L300 0M82 560L690 0M82 560L900 240"/>
          </g>
  </svg>
  <p id="loading" class="loading" role="status">Loading the map…</p>
  <svg id="map" viewBox="0 0 900 530" role="img" aria-labelledby="map-name map-desc" hidden>
    <title id="map-name">United States visitor origins map</title>
    <desc id="map-desc">Larger stars represent more responses. A ringed star marks the museum.</desc>
          <g id="insets"><path d="M20 363H185V474H20ZM190 415H287V499H190Z" fill="none" stroke="#ccc8b9" stroke-dasharray="3 4"/>
            <text class="inset-label" x="27" y="466">ALASKA</text><text class="inset-label" x="198" y="490">HAWAII</text></g>
          <g id="states"></g><g id="dots"></g><g id="labels"></g><g id="museum"></g>
  </svg>

  <header class="map-heading">
    <h1 id="page-title">Where are our visitors from?</h1>
    <div class="tools">
      <button type="button" id="clear-data" class="debug-button" disabled>Clear data</button>
      <button type="button" id="fullscreen" class="icon-button" aria-label="Enter full screen" aria-pressed="false" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg>
      </button>
    </div>
  </header>

  <div class="actions">
    <button id="open" class="primary" type="button" disabled><span aria-hidden="true">+</span> Add your location</button>
    <p class="status" id="confirmation" role="status" aria-live="polite"></p>
  </div>
  <div class="scale-overlay">
    <div class="scales" role="group" aria-label="Map scale">
      <button type="button" data-scope="world" aria-pressed="false" disabled>World</button>
      <button type="button" data-scope="us" aria-pressed="true" disabled>U.S.</button>
      <button type="button" data-scope="texas" aria-pressed="false" disabled>Texas</button>
    </div>
    <div class="response-count"><span id="response-total">—</span> <span id="response-label">responses</span></div>
  </div>
  <div class="zoom" role="group" aria-label="Zoom controls">
    <button type="button" id="zoom-in" aria-label="Zoom in" disabled>+</button>
    <button type="button" id="zoom-out" aria-label="Zoom out" disabled>−</button>
  </div>
  <footer class="credits" aria-label="Map data sources">
    <a href="https://github.com/topojson/us-atlas">U.S. Census</a><span aria-hidden="true"> · </span><a href="https://github.com/topojson/world-atlas">Natural Earth</a><span aria-hidden="true"> · </span><a href="https://github.com/mledoze/countries">Countries</a><span aria-hidden="true"> · </span><a href="https://www.geonames.org/">GeoNames</a>
  </footer>
</main>
<dialog id="entry" aria-labelledby="dialog-title">
  <div class="dialog-inner">
    <button id="close" class="close" type="button" aria-label="Close">×</button>
    <h2 id="dialog-title">Where do you<br> call home?</h2>
    <div class="mode" role="group" aria-label="Location type">
      <button id="domestic" type="button" aria-pressed="true">United States</button>
      <button id="abroad" type="button" aria-pressed="false">Outside the U.S.</button>
    </div>
    <form id="location-form" novalidate>
      <div id="zip-fields"><label for="zip">ZIP code</label><input id="zip" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="Enter 5 digits" aria-describedby="form-error"></div>
      <div id="country-fields" hidden><label for="country">Country or territory</label><select id="country" aria-describedby="form-error"><option value="">Select a location</option></select></div>
      <p id="form-error" class="error" role="alert"></p>
      <button class="primary submit" type="submit">Add to the map <span aria-hidden="true">→</span></button>
    </form>
  </div>
</dialog>
</body>
</html>
